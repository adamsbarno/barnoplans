services:
  - type: web
    name: barno-plans
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_IPN_ID
        sync: false
      - key: PESAPAL_IPN_ENVIRONMENT
        sync: false
      - key: PESAPAL_ENVIRONMENT
        value: sandbox
      - key: PUBLIC_APP_URL
        sync: false
      - key: DOWNLOAD_TOKEN_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: adamsbarno/barnoplans
      - key: GITHUB_BRANCH
        value: main
